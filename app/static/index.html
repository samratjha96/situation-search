<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Situation Search</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#252d3b;
    --txt:#e6ebf2; --muted:#8b97a8;
    --accent:#5b8cff; --good:#3ecf8e; --warn:#f0a742; --hot:#ff6b6b;
    --blue:#5b8cff; --purple:#b78bff; --gold:#f5c451;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:20px;background:var(--panel)}
  header h1{margin:0;font-size:17px;letter-spacing:.2px}
  header .matches{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  header .matches .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
  header .match{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  header .match:hover{color:var(--txt);border-color:var(--accent)}
  header .match.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  header .ctx{margin-left:auto;font-size:12px;color:var(--muted)}
  .wrap{display:grid;grid-template-columns:minmax(430px,1fr) minmax(430px,1fr);
    gap:18px;padding:18px;max-width:1440px;margin:0 auto}
  @media(max-width:920px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .left{position:sticky;top:18px;align-self:start}
  video{width:100%;border-radius:12px 12px 0 0;display:block;background:#000}
  .nowbar{padding:11px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
    border-top:1px solid var(--line)}
  .nowbar .tc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  .nowprose{padding:0 14px 12px;color:var(--muted);font-size:13px;min-height:18px}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;
    letter-spacing:.3px;text-transform:uppercase}
  /* ---- Event timeline (hero) ---- */
  .tl{padding:14px}
  .tl .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .axis{position:relative;height:66px;border-bottom:1px solid var(--line);
    margin-bottom:6px}
  .grid{position:absolute;top:0;bottom:0;border-left:1px dashed #2b3446}
  .grid span{position:absolute;bottom:-18px;transform:translateX(-50%);
    font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mk{position:absolute;bottom:0;width:3px;border-radius:2px;cursor:pointer;
    transform:translateX(-1.5px);transition:.1s}
  .mk:hover{width:5px;transform:translateX(-2.5px)}
  .mk.sel{outline:2px solid #fff;z-index:3}
  .mk.goal{width:5px;transform:translateX(-2.5px)}
  .axtimes{height:14px}
  .tip{position:fixed;z-index:60;max-width:330px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;
    line-height:1.45;color:var(--txt);pointer-events:none;display:none;
    box-shadow:0 8px 24px #000a}
  .tip .th{font-size:10px;color:var(--muted);margin-bottom:3px;
    text-transform:uppercase;letter-spacing:.5px}
  /* ---- tabs + lists ---- */
  .tabs{display:flex;gap:4px;padding:12px 12px 0}
  .tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);
    border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0}
  .tab.active{color:var(--txt);background:var(--panel2);border-color:var(--line)}
  .pane{padding:12px;display:none}
  .pane.active{display:block}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .chip:hover{color:var(--txt)}
  .chip.on{color:#fff}
  input[type=text]{width:100%;padding:12px 14px;font-size:14px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none}
  input:focus{border-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px;max-height:64vh;overflow:auto;margin-top:10px;
    transition:opacity .12s}
  .list.loading{opacity:.4;pointer-events:none}
  .reelbtn{margin-left:8px;background:var(--line);color:var(--txt);border:0;border-radius:6px;padding:3px 10px;font:inherit;cursor:pointer}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .row{display:grid;grid-template-columns:104px 1fr;gap:11px;padding:9px;
    border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.1s}
  .row:hover{border-color:var(--accent);background:var(--panel2)}
  .row.sel{border-color:#fff}
  .row img{width:104px;height:58px;object-fit:cover;border-radius:6px;background:#000}
  .row .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .row .tc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .pchip{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--txt)}
  .conf{font-size:10px;color:var(--good);border:1px solid var(--good);
    padding:1px 6px;border-radius:20px}
  .cf{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row p{color:var(--txt)}
  .plist .prow{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;
    cursor:pointer;border:1px solid transparent}
  .plist .prow:hover{background:var(--panel2);border-color:var(--line)}
  .plist .prow.sel{border-color:var(--accent);background:var(--panel2)}
  .plist .pn{flex:1}.plist .st{font-size:11px;color:var(--muted)}
  .g{color:var(--gold);font-weight:600}
  .note{font-size:11px;color:var(--muted);margin:2px 0 8px}
  .evidence{padding-left:0;list-style:none;margin:7px 0 0;font-size:12px}
  .evidence-line{margin-top:4px}.evidence-time{color:var(--muted);margin-right:6px}
  button.row{font:inherit;text-align:left;background:transparent;color:inherit}
  button.row:focus-visible{outline:2px solid var(--accent)}
  .passage-prose,.evidence,.evidence-line{display:block}
  .passage-prose{margin-top:4px;font-size:12px}.source{color:var(--muted);font-size:11px}
  .empty{padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Situation Search</h1>
  <div class="matches"><span class="lbl">Match</span><span id="clipsel"></span></div>
  <span class="ctx" id="ctx">loading…</span>
</header>

<div class="wrap">
  <div class="left card">
    <video id="video" controls preload="metadata"></video>
    <div class="nowbar"><span class="tc" id="nowtc">00:00</span><span id="nowbadges"></span></div>
    <div class="nowprose" id="nowprose"></div>
    <div class="tl">
      <div class="lbl">Event timeline <span id="tlcount"></span></div>
      <div class="axis" id="axis"></div>
      <div class="axtimes"></div>
    </div>
  </div>

  <div class="right card">
    <div class="tabs">
      <div class="tab active" data-tab="search">Search</div>
      <div class="tab" data-tab="events">Timeline</div>
      <div class="tab" data-tab="players">Players</div>
    </div>

    <div class="pane active" id="pane-search">
      <input id="q" aria-label="Search this match" type="text" placeholder="Search this match" autocomplete="off"/>
      <div class="filters" id="examples" style="margin-top:11px"></div>
      <div class="note" id="srnote" role="status"></div>
      <button class="chip" id="visual" hidden>Find visually similar passages</button>
      <div class="list" id="srlist"></div>
    </div>

    <div class="pane" id="pane-events">
      <div class="filters" id="evfilters"></div>
      <div class="list" id="evlist"></div>
    </div>

    <div class="pane" id="pane-players">
      <div class="plist list" id="plist"></div>
      <div class="note" id="prnote"></div>
      <div class="list" id="prlist"></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const COLORS={goal:'var(--gold)',shot:'var(--warn)',save:'var(--purple)',
  penalty:'#ff6b6b',foul:'#ff8a5b',tackle:'#ff8a5b',yellow_card:'#f5c451',
  red_card:'#ff4d4d',corner:'var(--blue)',free_kick:'var(--blue)',cross:'var(--blue)',
  throw_in:'var(--blue)',offside:'#f0a742',duel:'var(--hot)',dribble:'#3ecf8e',
  interception:'#57c4c9',clearance:'#7a869a',pass:'#5a6b85',out_of_play:'#3b4453',
  celebration:'var(--good)',other:'#3b4453'};
const color=e=>COLORS[e]||'#3b4453';
const NOTABLE=new Set(['goal','shot','save','penalty','foul','yellow_card','red_card',
  'corner','free_kick','cross','tackle','duel']);
// Everything interpolated into HTML (query, model output, names) goes through esc().
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const badge=(t,c)=>`<span class="badge" style="background:${esc(c)}22;color:${esc(c)}">${esc(t)}</span>`;

const video=document.getElementById('video');
let TL=[], DUR=620, activeTypes=null, sel=null, CLIP='';
const withClip=q=>`${q}${q.includes('?')?'&':'?'}clip=${encodeURIComponent(CLIP)}`;
// Action times come from the video itself; start a second early to see the touch.
const PREROLL=1;

function jump(t,id){
  REEL=null; sel=id; video.currentTime=Math.max(0, t-PREROLL); video.play().catch(()=>{});
  document.querySelectorAll('.mk').forEach(m=>m.classList.toggle('sel',m.dataset.id==id));
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.id==id));
}
function setNow(e){
  document.getElementById('nowtc').textContent=e.timecode;
  const sb = e.type==='goal'&&e.scorebug_corroborated ? ' <span class="conf">scoreboard ✓</span>':'';
  document.getElementById('nowbadges').innerHTML=badge(e.type,color(e.type))+sb+
    (e.key_player?` <span class="pchip">${esc(e.key_player)}</span>`:'');
  document.getElementById('nowprose').textContent=e.detail||e.summary||'';
}

function showTip(m,e){
  const tip=document.getElementById('tip');
  const sb=e.type==='goal'&&e.scorebug_corroborated?' · scoreboard ✓':'';
  tip.innerHTML=`<div class="th">${esc(e.timecode)} · ${esc(e.type)}${e.key_player?' · '+esc(e.key_player):''}${sb}</div>${esc(e.detail||e.summary||'(no description)')}`;
  tip.style.display='block';
  const r=m.getBoundingClientRect();
  let left=Math.max(8,Math.min(window.innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2));
  let top=r.bottom+8;
  if(top+tip.offsetHeight>window.innerHeight-8) top=r.top-tip.offsetHeight-8;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hideTip(){ document.getElementById('tip').style.display='none'; }

function renderAxis(){
  const ax=document.getElementById('axis'); ax.innerHTML='';
  for(let mnt=0;mnt<=DUR;mnt+=60){
    const g=document.createElement('div'); g.className='grid';
    g.style.left=(100*mnt/DUR)+'%';
    g.innerHTML=`<span>${String(Math.floor(mnt/60)).padStart(2,'0')}:00</span>`;
    ax.appendChild(g);
  }
  TL.filter(e=>!activeTypes||activeTypes.has(e.type)).forEach(e=>{
    const m=document.createElement('div');
    m.className='mk'+(e.type==='goal'?' goal':''); m.dataset.id=e._id;
    m.style.left=(100*e.t_seconds/DUR)+'%';
    m.style.background=color(e.type);
    m.style.height=(NOTABLE.has(e.type)?66:26)+'px';
    m.style.opacity=NOTABLE.has(e.type)?0.95:0.4;
    m.onmouseenter=()=>showTip(m,e);
    m.onmouseleave=hideTip;
    m.onclick=()=>{jump(e.t_seconds,e._id);setNow(e);};
    ax.appendChild(m);
  });
}
function renderEvents(){
  const list=TL.filter(e=>!activeTypes||activeTypes.has(e.type));
  const box=document.getElementById('evlist');
  box.innerHTML=list.length?list.map(e=>`
    <div class="row" data-id="${e._id}">
      <img loading="lazy" src="/media/${esc(e.image)}"/>
      <div>
        <div class="top">
          ${badge(e.type,color(e.type))}
          ${e.type==='goal'&&e.scorebug_corroborated?'<span class="conf">scoreboard ✓</span>':''}
          ${e.key_player?`<span class="pchip">${esc(e.key_player)}</span>`:''}
          ${e.confidence?`<span class="cf">${Math.round(e.confidence*100)}%</span>`:''}
          <span class="tc">${esc(e.timecode)}</span>
        </div>
        <p>${esc(e.detail||e.summary||'')}</p>
      </div>
    </div>`).join(''):'<div class="empty">No events of these types.</div>';
  box.querySelectorAll('.row').forEach(el=>{
    const e=TL.find(x=>x._id==el.dataset.id);
    el.onclick=()=>{jump(e.t_seconds,e._id);setNow(e);};
  });
}
function renderFilters(){
  const types=[...new Set(TL.map(e=>e.type))].sort((a,b)=>
    (NOTABLE.has(b)?1:0)-(NOTABLE.has(a)?1:0)||a.localeCompare(b));
  const box=document.getElementById('evfilters');
  box.innerHTML=`<span class="chip" data-t="__notable">notable</span>
    <span class="chip" data-t="__all">all</span>`+
    types.map(t=>`<span class="chip" data-t="${esc(t)}" style="border-color:${esc(color(t))}55">${esc(t)}</span>`).join('');
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;
    if(t==='__all') activeTypes=null;
    else if(t==='__notable') activeTypes=new Set(NOTABLE);
    else activeTypes=new Set([t]);
    box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    renderAxis(); renderEvents();
  });
}

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+t.dataset.tab));
});

// ---- search ----
const EXAMPLES=["live corner followed by a saved shot","regain possession, advance and shoot","corner that ended in a goal","long passes under tight pressure","switch of play"];
let timer=null, searchSeq=0;
const visualButton=document.getElementById('visual');

function evidenceList(row){
  if(!row.evidence?.length || (row.evidence.length===1 && !row.evidence[0].source)) return '';
  return '<span class="evidence">'+row.evidence.map(e=>{
    const source=e.source==='reviewed_video'?' · Video review':e.source==='scoreboard'?' · Scoreboard':'';
    return `<span class="evidence-line"><span class="evidence-time">${fmt(e.t)}</span>${esc(e.detail)}<span class="source">${source}</span></span>`;
  }).join('')+'</span>';
}
function renderPassages(box,rows){
  box.innerHTML=rows.map(m=>`
    <button type="button" class="row" aria-label="Play passage: ${esc(m.prose)} at ${esc(m.timecode)}">
      <img loading="lazy" alt="" src="/media/${esc(m.image)}"/>
      <span><span class="top">${badge(m.event,color(m.event))}
        ${m.outcome?badge(m.outcome,color(m.outcome)):''}
        ${m.scorer?`<span class="pchip">⚽ ${esc(m.scorer)}</span>`:''}
        <span class="tc">${esc(m.timecode)} – ${fmt(m.episode_end)}</span></span>
        <span class="passage-prose">${esc(m.prose)}</span>${evidenceList(m)}</span>
    </button>`).join('');
  box.querySelectorAll('.row').forEach((button,i)=>{
    const m=rows[i];
    button.onclick=()=>playReel([[m.t_seconds,m.episode_end]]);
  });
}
async function doSearch(visual=false){
  const q=document.getElementById('q').value;
  const box=document.getElementById('srlist');
  const note=document.getElementById('srnote');
  const seq=++searchSeq;
  visualButton.hidden=true;
  box.classList.add('loading');
  note.textContent=visual?'Searching video frames…':'Searching…';
  let j;
  try{
    const path=visual?'visual-search':'search';
    const response=await fetch(withClip(`/api/${path}?q=${encodeURIComponent(q)}`));
    if(!response.ok) throw new Error('Request failed');
    j=await response.json();
  }catch{
    if(seq===searchSeq){box.replaceChildren(); box.classList.remove('loading'); note.textContent='Search failed. Please retry.';}
    return;
  }
  if(seq!==searchSeq) return;
  box.classList.remove('loading');
  visualButton.hidden=visual || !q.trim();
  if(!j.results.length){
    box.replaceChildren();
    note.textContent=j.message || `No indexed match for “${q}”.`;
    return;
  }
  note.textContent=j.message || `${j.count} ${j.count===1?'match':'matches'}`;
  renderPassages(box,j.results);
  if(j.reel?.length){
    const seconds=j.reel.reduce((sum,[start,end])=>sum+end-start,0);
    note.innerHTML=`${j.reel.length} snippets · ${fmt(seconds)} <button class="reelbtn" id="reelbtn">▶ Play reel</button>`;
    document.getElementById('reelbtn').onclick=()=>playReel(j.reel);
  }
}
visualButton.onclick=()=>doSearch(true);

// Play [start,end] snippets back to back; any manual seek or pause ends the reel.
let REEL=null;
function playReel(segs){ REEL={segs,i:0}; video.currentTime=segs[0][0]; video.play().catch(()=>{}); }
video.addEventListener('timeupdate',()=>{
  if(!REEL) return;
  const [s,e]=REEL.segs[REEL.i];
  if(video.currentTime<s-1.5){ REEL=null; return; }
  if(video.currentTime>=e){
    if(++REEL.i>=REEL.segs.length){ REEL=null; video.pause(); video.currentTime=e; return; }
    video.currentTime=REEL.segs[REEL.i][0];
  }
});
video.addEventListener('seeking',()=>{
  if(REEL){ const [s,e]=REEL.segs[REEL.i]; if(video.currentTime<s-1.5||video.currentTime>e+1.5) REEL=null; }
});
document.getElementById('q').addEventListener('input',()=>{clearTimeout(timer); ++searchSeq; visualButton.hidden=true; timer=setTimeout(doSearch,280);});
document.getElementById('examples').innerHTML=EXAMPLES.map(e=>`<button class="chip">${esc(e)}</button>`).join('');
document.querySelectorAll('#examples .chip').forEach(c=>c.onclick=()=>{document.getElementById('q').value=c.textContent;doSearch();});

// ---- players ----
async function loadPlayers(){
  const selected=CLIP;
  const j=await(await fetch(withClip('/api/players'))).json();
  if(CLIP!==selected) return;
  document.getElementById('plist').innerHTML=j.players.map(p=>{
    const st=[p.goals?`<span class="g">⚽${p.goals}</span>`:'',p.assists?`🅰${p.assists}`:'',
      p.shots?`Sh${p.shots}`:''].filter(Boolean).join(' ')||`${p.appearances} actions`;
    return `<div class="prow" data-n="${esc(encodeURIComponent(p.name))}"><span class="pn">${esc(p.name)}</span><span class="st">${st}</span></div>`;
  }).join('');
  document.querySelectorAll('#plist .prow').forEach(el=>el.onclick=()=>selectPlayer(decodeURIComponent(el.dataset.n),el));
}
async function selectPlayer(name,el){
  const selected=CLIP;
  document.querySelectorAll('#plist .prow').forEach(x=>x.classList.toggle('sel',x===el));
  const j=await(await fetch(withClip(`/api/player?name=${encodeURIComponent(name)}`))).json();
  if(CLIP!==selected || !el.classList.contains('sel')) return;
  const s=j.stats;
  document.getElementById('prnote').innerHTML=`<b>${esc(j.name)}</b> — ${s.goals||0} goals · ${s.shots||0} shots · ${s.appearances||0} actions`+
    (j.reel.length?` <button class="reelbtn" id="preelbtn">▶ Play reel</button>`:'');
  if(j.reel.length) document.getElementById('preelbtn').onclick=()=>playReel(j.reel);
  renderPassages(document.getElementById('prlist'),j.moments);
}

async function loadClips(){
  const j=await(await fetch('/api/clips')).json();
  const el=document.getElementById('clipsel');
  el.innerHTML=(j.clips||[]).map(c=>`<button class="match" data-c="${esc(c.name)}">${esc(c.label)}</button>`).join('');
  CLIP=j.default||((j.clips||[])[0]||{}).name||'';
  const mark=()=>el.querySelectorAll('.match').forEach(b=>b.classList.toggle('on',b.dataset.c===CLIP));
  mark();
  el.querySelectorAll('.match').forEach(b=>b.onclick=()=>{ if(b.dataset.c!==CLIP){ CLIP=b.dataset.c; mark(); switchClip(); } });
}
async function loadClip(){
  const selected=CLIP;
  const mj=await(await fetch(withClip('/api/clip'))).json();
  if(CLIP!==selected) return;
  video.src=`/media/${mj.video}`;
  const tj=await(await fetch(withClip('/api/timeline'))).json();
  if(CLIP!==selected) return;
  TL=tj.events.map((e,i)=>({...e,_id:i})); DUR=tj.duration;
  document.getElementById('ctx').textContent=`${TL.length} events`;
  document.getElementById('tlcount').textContent=`· ${TL.length} events · ${tj.confirmed_goals} confirmed goals`;
  activeTypes=new Set(NOTABLE);
  renderFilters();
  document.querySelector('#evfilters .chip[data-t="__notable"]').classList.add('on');
  renderAxis(); renderEvents(); loadPlayers();
  doSearch();
}
function switchClip(){
  // reset per-clip UI state, then reload everything for the newly-selected clip
  clearTimeout(timer); ++searchSeq; REEL=null; video.pause(); visualButton.hidden=true;
  document.getElementById('srlist').replaceChildren();
  document.getElementById('srnote').textContent='';
  sel=null; TL=[]; activeTypes=null;
  document.getElementById('prnote').innerHTML='';
  document.getElementById('prlist').innerHTML='';
  document.getElementById('plist').innerHTML='';
  document.getElementById('nowprose').textContent='';
  document.getElementById('nowbadges').innerHTML='';
  document.getElementById('nowtc').textContent='00:00';
  loadClip();
}
async function init(){
  document.getElementById('q').value=new URLSearchParams(location.search).get('q')||EXAMPLES[0];
  await loadClips(); loadClip();
}
init();
</script>
