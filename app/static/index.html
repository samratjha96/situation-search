<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Situation Search</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#252d3b;
    --txt:#e6ebf2; --muted:#8b97a8;
    --accent:#5b8cff; --good:#3ecf8e; --warn:#f0a742; --hot:#ff6b6b;
    --blue:#5b8cff; --purple:#b78bff; --gold:#f5c451;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:12px;background:var(--panel)}
  header h1{margin:0;font-size:17px;letter-spacing:.2px}
  header .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);
    padding:2px 8px;border-radius:20px}
  header .ctx{margin-left:auto;font-size:12px;color:var(--muted)}
  .wrap{display:grid;grid-template-columns:minmax(430px,1fr) minmax(430px,1fr);
    gap:18px;padding:18px;max-width:1440px;margin:0 auto}
  @media(max-width:920px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .left{position:sticky;top:18px;align-self:start}
  video{width:100%;border-radius:12px 12px 0 0;display:block;background:#000}
  .nowbar{padding:11px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
    border-top:1px solid var(--line)}
  .nowbar .tc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
  .nowprose{padding:0 14px 12px;color:var(--muted);font-size:13px;min-height:18px}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;
    letter-spacing:.3px;text-transform:uppercase}
  /* ---- Event timeline (hero) ---- */
  .tl{padding:14px}
  .tl .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .axis{position:relative;height:66px;border-bottom:1px solid var(--line);
    margin-bottom:6px}
  .grid{position:absolute;top:0;bottom:0;border-left:1px dashed #2b3446}
  .grid span{position:absolute;bottom:-18px;transform:translateX(-50%);
    font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mk{position:absolute;bottom:0;width:3px;border-radius:2px;cursor:pointer;
    transform:translateX(-1.5px);transition:.1s}
  .mk:hover{width:5px;transform:translateX(-2.5px)}
  .mk.sel{outline:2px solid #fff;z-index:3}
  .mk.goal{width:5px;transform:translateX(-2.5px)}
  .axtimes{height:14px}
  /* ---- tabs + lists ---- */
  .tabs{display:flex;gap:4px;padding:12px 12px 0}
  .tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);
    border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0}
  .tab.active{color:var(--txt);background:var(--panel2);border-color:var(--line)}
  .pane{padding:12px;display:none}
  .pane.active{display:block}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .chip:hover{color:var(--txt)}
  .chip.on{color:#fff}
  input[type=text]{width:100%;padding:12px 14px;font-size:14px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;color:var(--txt);outline:none}
  input:focus{border-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px;max-height:64vh;overflow:auto;margin-top:10px}
  .row{display:grid;grid-template-columns:104px 1fr;gap:11px;padding:9px;
    border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.1s}
  .row:hover{border-color:var(--accent);background:var(--panel2)}
  .row.sel{border-color:#fff}
  .row img{width:104px;height:58px;object-fit:cover;border-radius:6px;background:#000}
  .row .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .row .tc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .pchip{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--txt)}
  .conf{font-size:10px;color:var(--good);border:1px solid var(--good);
    padding:1px 6px;border-radius:20px}
  .cf{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row p{color:var(--txt)}
  .plist .prow{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;
    cursor:pointer;border:1px solid transparent}
  .plist .prow:hover{background:var(--panel2);border-color:var(--line)}
  .plist .prow.sel{border-color:var(--accent);background:var(--panel2)}
  .plist .pn{flex:1}.plist .st{font-size:11px;color:var(--muted)}
  .g{color:var(--gold);font-weight:600}
  .note{font-size:11px;color:var(--muted);margin:2px 0 8px}
  .empty{padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Situation Search</h1>
  <span class="tag">find any match moment by describing it · runs on a laptop</span>
  <span class="ctx" id="ctx">loading…</span>
</header>

<div class="wrap">
  <div class="left card">
    <video id="video" controls preload="metadata"></video>
    <div class="nowbar"><span class="tc" id="nowtc">00:00</span><span id="nowbadges"></span></div>
    <div class="nowprose" id="nowprose">Click any event to jump the video.</div>
    <div class="tl">
      <div class="lbl">Event timeline <span id="tlcount"></span></div>
      <div class="axis" id="axis"></div>
      <div class="axtimes"></div>
    </div>
  </div>

  <div class="right card">
    <div class="tabs">
      <div class="tab active" data-tab="search">Search</div>
      <div class="tab" data-tab="events">Timeline</div>
      <div class="tab" data-tab="players">Players</div>
    </div>

    <div class="pane active" id="pane-search">
      <input id="q" type="text" placeholder="Ask this match anything — e.g. “goalkeeper diving save”" autocomplete="off"/>
      <div class="filters" id="examples" style="margin-top:11px"></div>
      <div class="note" id="srnote"></div>
      <div class="list" id="srlist"></div>
    </div>

    <div class="pane" id="pane-events">
      <div class="note" id="evnote"></div>
      <div class="filters" id="evfilters"></div>
      <div class="list" id="evlist"></div>
    </div>

    <div class="pane" id="pane-players">
      <div class="plist list" id="plist"></div>
      <div class="note">Stats are counted from the confirmed event list, not per frame.</div>
      <div class="note" id="prnote"></div>
      <div class="list" id="prlist"></div>
    </div>
  </div>
</div>

<script>
const COLORS={goal:'var(--gold)',shot:'var(--warn)',save:'var(--purple)',
  penalty:'#ff6b6b',foul:'#ff8a5b',tackle:'#ff8a5b',yellow_card:'#f5c451',
  red_card:'#ff4d4d',corner:'var(--blue)',free_kick:'var(--blue)',cross:'var(--blue)',
  throw_in:'var(--blue)',offside:'#f0a742',duel:'var(--hot)',dribble:'#3ecf8e',
  interception:'#57c4c9',clearance:'#7a869a',pass:'#5a6b85',out_of_play:'#3b4453',
  celebration:'var(--good)',other:'#3b4453'};
const color=e=>COLORS[e]||'#3b4453';
const NOTABLE=new Set(['goal','shot','save','penalty','foul','yellow_card','red_card',
  'corner','free_kick','cross','tackle','duel']);
const badge=(t,c)=>`<span class="badge" style="background:${c}22;color:${c}">${t}</span>`;

const video=document.getElementById('video');
let TL=[], DUR=620, MOMENTS=[], activeTypes=null, sel=null;

function jump(t,id){
  sel=id; video.currentTime=t+0.05; video.play().catch(()=>{});
  document.querySelectorAll('.mk').forEach(m=>m.classList.toggle('sel',m.dataset.id==id));
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.id==id));
}
function setNow(e){
  document.getElementById('nowtc').textContent=e.timecode;
  const sb = e.type==='goal'&&e.scorebug_corroborated ? ' <span class="conf">scoreboard ✓</span>':'';
  document.getElementById('nowbadges').innerHTML=badge(e.type,color(e.type))+sb+
    (e.key_player?` <span class="pchip">${e.key_player}</span>`:'');
  document.getElementById('nowprose').textContent=e.detail||e.summary||'';
}

function renderAxis(){
  const ax=document.getElementById('axis'); ax.innerHTML='';
  for(let mnt=0;mnt<=DUR;mnt+=60){
    const g=document.createElement('div'); g.className='grid';
    g.style.left=(100*mnt/DUR)+'%';
    g.innerHTML=`<span>${String(Math.floor(mnt/60)).padStart(2,'0')}:00</span>`;
    ax.appendChild(g);
  }
  TL.filter(e=>!activeTypes||activeTypes.has(e.type)).forEach(e=>{
    const m=document.createElement('div');
    m.className='mk'+(e.type==='goal'?' goal':''); m.dataset.id=e._id;
    m.style.left=(100*e.t_seconds/DUR)+'%';
    m.style.background=color(e.type);
    m.style.height=(NOTABLE.has(e.type)?66:26)+'px';
    m.style.opacity=NOTABLE.has(e.type)?0.95:0.4;
    m.title=`${e.timecode} · ${e.type}${e.key_player?' · '+e.key_player:''}`;
    m.onclick=()=>{jump(e.t_seconds,e._id);setNow(e);};
    ax.appendChild(m);
  });
}
function renderEvents(){
  const list=TL.filter(e=>!activeTypes||activeTypes.has(e.type));
  const box=document.getElementById('evlist');
  box.innerHTML=list.length?list.map(e=>`
    <div class="row" data-id="${e._id}">
      <img loading="lazy" src="/media/${e.image}"/>
      <div>
        <div class="top">
          ${badge(e.type,color(e.type))}
          ${e.type==='goal'&&e.scorebug_corroborated?'<span class="conf">scoreboard ✓</span>':''}
          ${e.key_player?`<span class="pchip">${e.key_player}</span>`:''}
          ${e.confidence?`<span class="cf">${Math.round(e.confidence*100)}%</span>`:''}
          <span class="tc">${e.timecode}</span>
        </div>
        <p>${e.detail||e.summary||''}</p>
      </div>
    </div>`).join(''):'<div class="empty">No events of these types.</div>';
  box.querySelectorAll('.row').forEach(el=>{
    const e=TL.find(x=>x._id==el.dataset.id);
    el.onclick=()=>{jump(e.t_seconds,e._id);setNow(e);};
  });
}
function renderFilters(){
  const types=[...new Set(TL.map(e=>e.type))].sort((a,b)=>
    (NOTABLE.has(b)?1:0)-(NOTABLE.has(a)?1:0)||a.localeCompare(b));
  const box=document.getElementById('evfilters');
  box.innerHTML=`<span class="chip" data-t="__notable">notable</span>
    <span class="chip" data-t="__all">all</span>`+
    types.map(t=>`<span class="chip" data-t="${t}" style="border-color:${color(t)}55">${t}</span>`).join('');
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;
    if(t==='__all') activeTypes=null;
    else if(t==='__notable') activeTypes=new Set(NOTABLE);
    else activeTypes=new Set([t]);
    box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    renderAxis(); renderEvents();
  });
}

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+t.dataset.tab));
});

// ---- search ----
const EXAMPLES=["counter attack","goalkeeper diving save","shot on goal","goal celebration","corner in the box","build-up from the back"];
let timer=null;
async function doSearch(){
  const q=document.getElementById('q').value;
  const j=await(await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
  const box=document.getElementById('srlist');
  const maxs=Math.max(...j.results.map(r=>r.relevance||0),1e-6);
  box.innerHTML=j.results.length?j.results.map(m=>`
    <div class="row" data-t="${m.t_seconds}">
      <img loading="lazy" src="/media/${m.image}"/>
      <div><div class="top">${badge(m.event,color(m.event))}
        ${m.scorer?`<span class="pchip">⚽ ${m.scorer}</span>`:''}
        <span class="tc">${m.timecode}</span></div><p>${m.prose||''}</p></div></div>`).join(''):
    '<div class="empty">No matches.</div>';
  box.querySelectorAll('.row').forEach(el=>el.onclick=()=>jump(+el.dataset.t,null));
  document.getElementById('srnote').textContent=(j.semantic?'semantic':'keyword')+` · ${j.results.length} results`;
}
document.getElementById('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(doSearch,280);});
document.getElementById('examples').innerHTML=EXAMPLES.map(e=>`<span class="chip">${e}</span>`).join('');
document.querySelectorAll('#examples .chip').forEach(c=>c.onclick=()=>{document.getElementById('q').value=c.textContent;doSearch();});

// ---- players ----
async function loadPlayers(){
  const j=await(await fetch('/api/players')).json();
  document.getElementById('plist').innerHTML=j.players.map(p=>{
    const st=[p.goals?`<span class="g">⚽${p.goals}</span>`:'',p.assists?`🅰${p.assists}`:'',
      p.shots?`Sh${p.shots}`:'',p.cards?`🟨${p.cards}`:''].filter(Boolean).join(' ')||`${p.appearances} moments`;
    return `<div class="prow" data-n="${encodeURIComponent(p.name)}"><span class="pn">${p.name}</span><span class="st">${st}</span></div>`;
  }).join('');
  document.querySelectorAll('#plist .prow').forEach(el=>el.onclick=()=>selectPlayer(decodeURIComponent(el.dataset.n),el));
}
async function selectPlayer(name,el){
  document.querySelectorAll('#plist .prow').forEach(x=>x.classList.toggle('sel',x===el));
  const j=await(await fetch(`/api/player?name=${encodeURIComponent(name)}`)).json();
  const s=j.stats;
  document.getElementById('prnote').innerHTML=`<b>${name}</b> — ${s.goals}G ${s.assists}A ${s.shots}Sh ${s.cards}C · ${s.appearances} moments`;
  const box=document.getElementById('prlist');
  box.innerHTML=j.moments.map(m=>`
    <div class="row" data-t="${m.t_seconds}"><img loading="lazy" src="/media/${m.image}"/>
    <div><div class="top">${badge(m.event,color(m.event))}<span class="tc">${m.timecode}</span></div>
    <p>${m.prose||''}</p></div></div>`).join('');
  box.querySelectorAll('.row').forEach(x=>x.onclick=()=>jump(+x.dataset.t,null));
}

async function init(){
  const mj=await(await fetch('/api/moments')).json();
  MOMENTS=mj.moments; video.src=`/media/${mj.video}`;
  const tj=await(await fetch('/api/timeline')).json();
  TL=tj.events.map((e,i)=>({...e,_id:i})); DUR=tj.duration;
  document.getElementById('ctx').textContent=`${TL.length} events · ${mj.video}`;
  document.getElementById('tlcount').textContent=`· ${TL.length} events · ${tj.confirmed_goals} confirmed goals`;
  document.getElementById('evnote').innerHTML=
    `Read directly from the video — works with no scoreboard or commentary. A goal is `+
    `detected when the ball is seen entering the net (<span class="conf">scoreboard ✓</span> `+
    `= the scoreboard also agreed). Replays & celebrations are excluded. Identity is `+
    `best-effort (number/colour).`;
  activeTypes=new Set(NOTABLE);
  renderFilters();
  document.querySelector('#evfilters .chip[data-t="__notable"]').classList.add('on');
  renderAxis(); renderEvents(); loadPlayers();
  // land on live search results so the tool shows its value immediately
  const q0=new URLSearchParams(location.search).get('q')||'shot on goal';
  document.getElementById('q').value=q0; doSearch();
}
init();
</script>
</body>
</html>
